---
# The server needs Postgres to start, so test the install rather than a running process.
schemaVersion: "2.0.0"
fileExistenceTests:
  - name: server
    path: /app/main.py
    shouldExist: true
  - name: entrypoint
    path: /entrypoint.sh
    shouldExist: true
    isExecutableBy: any
  - name: apply-config
    path: /scripts/apply-config.py
    shouldExist: true
commandTests:
  - name: imports
    command: python
    args:
      - -c
      - "import importlib.metadata as m, alembic, fastapi, psycopg, uvicorn, mem0; print(m.version('mem0ai'))"
    expectedOutput: ["^\\d+\\.\\d+\\.\\d+"]
